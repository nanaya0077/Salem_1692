<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>女巫镇 · 竖屏牌桌原型</title>
<style>
  :root{
    --bg:#080605; --panel:#17110d; --panel2:#211811; --line:#3a2b20;
    --ink:#efe4d1; --muted:#a48d75; --gold:#c9a227; --gold2:#e7c766;
    --red:#a8322a; --red2:#d45545; --green:#4f6b46; --blue:#3f5d73;
    --purple:#5b4a6b; --black:#1b1714; --paper:#e7d9bd; --paper2:#cdbb9a;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{display:grid;place-items:center;min-height:100dvh;overflow:hidden;background:
    radial-gradient(1200px 700px at 50% -10%, #2a1b12 0%, #0b0806 55%, #050403 100%);}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
    background-image:radial-gradient(#7a5b3a 0.6px, transparent 0.6px);background-size:7px 7px;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .phone{position:relative;width:min(430px,100vw);height:min(920px,100dvh);display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#1b130e 0%,#0e0a08 40%,#0a0706 100%);
    border-radius:0;box-shadow:none;}
  @media (min-width:620px){
    .phone{height:min(900px,100dvh);border:8px solid #2a211a;border-radius:40px;box-shadow:var(--shadow),0 0 0 1px #4a3524 inset;}
  }
  .phone:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:radial-gradient(700px 420px at 50% 0%, rgba(201,162,39,.08), transparent 60%),
               radial-gradient(500px 300px at 100% 100%, rgba(168,50,42,.06), transparent 60%);}
  .topbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid rgba(201,162,39,.16);background:rgba(12,9,7,.72);backdrop-filter:blur(12px)}
  .room{display:flex;flex-direction:column;line-height:1.1}
  .room b{font-family:Georgia,"Noto Serif SC",serif;font-size:15px;letter-spacing:.12em;color:var(--gold2)}
  .room span{font-size:9px;color:var(--muted);letter-spacing:.18em;margin-top:3px}
  .phase{flex:1;text-align:center;min-width:0}
  .phase b{display:block;font-size:12px;letter-spacing:.08em;color:var(--ink)}
  .phase span{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .timer{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
    background:conic-gradient(var(--gold) 0 72%, #3a2b20 72% 100%);}
  .timer:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#120d0a}
  .timer b{position:relative;z-index:1;font-size:11px;color:var(--gold2)}
  .iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px;background:rgba(255,255,255,.02)}
  .main{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 8px;scrollbar-width:none}
  .main::-webkit-scrollbar{display:none}
  .public{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .public::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid rgba(201,162,39,.18);border-radius:999px;background:rgba(255,255,255,.025);font-size:10px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .chip.hot{border-color:rgba(168,50,42,.5);color:#e6b7a8;background:rgba(168,50,42,.10)}
  .table{position:relative;min-height:330px}
  .ring{position:relative;height:330px;display:none}
  .variant-ring .ring{display:block}
  .variant-strip .strip{display:grid}
  .variant-list .list{display:grid}
  .table-center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle at 42% 36%, #3a2a1d 0%, #1a120d 58%, #0d0907 100%);
    border:1px solid rgba(201,162,39,.25);box-shadow:0 0 0 8px rgba(201,162,39,.03),0 0 40px rgba(0,0,0,.6) inset;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;overflow:hidden}
  .table-center:before{content:"";position:absolute;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #f4e6bd 0%, #c9a227 24%, #6d4e1a 58%, #2a1a0c 100%);
    box-shadow:0 0 26px rgba(231,199,102,.28);opacity:.92}
  .table-center:after{content:"";position:absolute;width:96px;height:96px;border-radius:50%;border:1px dashed rgba(231,199,102,.22)}
  .table-center .moon-label{position:relative;z-index:2;margin-top:27px;font-family:Georgia,"Noto Serif SC",serif;font-size:9px;letter-spacing:.28em;color:#1a120c;font-weight:700}
  .table-center .center-meta{position:relative;z-index:2;font-size:9px;color:var(--muted);letter-spacing:.08em}
  .seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;max-width:74px;border-radius:12px;padding:3px 2px;transition:.18s transform,.18s background,.18s box-shadow}
  .ring .seat{position:absolute;transform:translate(-50%,-50%);z-index:3}
  .seat:hover{background:rgba(255,255,255,.035)}
  .seat .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,"Noto Serif SC",serif;font-size:15px;font-weight:700;color:#f5e8cf;
    background:linear-gradient(145deg,#5d4630,#2b1e14);border:1px solid rgba(231,199,102,.38);box-shadow:0 4px 12px rgba(0,0,0,.45),0 0 0 2px rgba(0,0,0,.18) inset}
  .seat.active .avatar{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(201,162,39,.22),0 0 18px rgba(201,162,39,.35),0 4px 12px rgba(0,0,0,.45);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 2px rgba(201,162,39,.16),0 0 12px rgba(201,162,39,.22),0 4px 12px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 3px rgba(201,162,39,.3),0 0 24px rgba(201,162,39,.42),0 4px 12px rgba(0,0,0,.45)}}
  .seat.dead{opacity:.42;filter:grayscale(1)}
  .seat.dead .avatar:after{content:"✕";position:absolute;font-size:22px;color:#d45545;font-weight:700;text-shadow:0 2px 6px #000}
  .seat.targetable .avatar{outline:1px dashed var(--gold2);outline-offset:3px}
  .seat.night-target .avatar{box-shadow:0 0 0 2px var(--red2),0 0 18px rgba(212,85,69,.5)}
  .seat-name{max-width:74px;font-size:10px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e4d6c0;text-shadow:0 1px 2px #000}
  .seat-meta{display:flex;align-items:center;gap:3px;height:13px}
  .acc-badge{min-width:15px;height:15px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(180deg,#c4483a,#7e241d);box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .acc-badge.zero{background:#3a2b20;color:#9f886f;box-shadow:none}
  .trial-dots{display:flex;gap:2px}
  .dot{width:4px;height:10px;border-radius:1px;border:1px solid #4b3828;background:#241a13}
  .dot.revealed{background:#d8c39f;border-color:#e8d6b6}
  .dot.constable{background:var(--gold);border-color:var(--gold2)}
  .dot.witch{background:var(--red2);border-color:#e07a6c}
  .dot.notawitch{background:#9fae8f;border-color:#c7d4b8}
  .blue-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1px #22323d}
  .blue-dot.gold{background:var(--gold)}
  .strip{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 2px 10px;align-content:center;height:100%}
  .strip .seat{width:auto;max-width:none;min-height:84px;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid rgba(201,162,39,.16);padding:7px 4px;gap:4px}
  .strip .seat .avatar{width:32px;height:32px;font-size:12px}
  .strip .seat-name{font-size:10px;max-width:100%}
  .strip .seat-meta{margin-top:1px;gap:3px}
  .strip .seat .mini-ability{display:none}
  .list{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:2px 0 10px;align-content:center;height:100%}
  .list .seat{display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center;width:auto;max-width:none;min-height:54px;padding:7px;border:1px solid rgba(201,162,39,.16);background:rgba(255,255,255,.025);border-radius:10px}
  .list .seat .avatar{grid-row:1/3;width:34px;height:34px;font-size:12px}
  .list .seat-name{grid-column:2;font-size:10px;max-width:none;align-self:end}
  .list .seat-meta{grid-column:2;justify-self:start;align-self:start}
  .self{position:relative;margin-top:4px;border:1px solid rgba(201,162,39,.26);border-radius:14px;background:linear-gradient(180deg,rgba(46,33,22,.86),rgba(20,14,10,.92));box-shadow:0 10px 26px rgba(0,0,0,.28);overflow:hidden}
  .self:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(#c9a227 .6px,transparent .6px);background-size:8px 8px}
  .self-head{position:relative;display:flex;align-items:center;gap:8px;padding:9px 10px 7px}
  .identity-seal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:Georgia,"Noto Serif SC",serif;font-size:15px;font-weight:700;color:#1b120b;background:radial-gradient(circle at 38% 30%,#f1dfb0,#c9a227 52%,#7a571b);box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.18) inset}
  .identity-info{flex:1;min-width:0}
  .identity-name{font-family:Georgia,"Noto Serif SC",serif;font-size:13px;letter-spacing:.04em;color:#f2e4c9;display:flex;align-items:center;gap:6px}
  .role-badge{font-family:"Noto Sans SC",sans-serif;font-size:8px;letter-spacing:.12em;padding:2px 5px;border-radius:4px;border:1px solid rgba(168,50,42,.5);color:#e7a99c;background:rgba(168,50,42,.14)}
  .role-badge.good{border-color:rgba(79,107,70,.6);color:#b9cca8;background:rgba(79,107,70,.16)}
  .identity-ability{font-size:8.5px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .acc-meter{flex:none;text-align:right;min-width:58px}
  .acc-meter .label{font-size:8px;color:var(--muted);letter-spacing:.12em}
  .acc-meter .num{font-family:Georgia,serif;font-size:19px;line-height:1;color:var(--red2)}
  .pips{display:flex;gap:2px;justify-content:flex-end;margin-top:3px}
  .pip{width:4px;height:4px;border-radius:50%;background:#3a2b20}
  .pip.on{background:var(--red2);box-shadow:0 0 4px rgba(212,85,69,.5)}
  .self-trials{position:relative;display:flex;gap:6px;padding:0 10px 8px}
  .trial{position:relative;flex:1;height:46px;border-radius:6px;border:1px solid #4b3828;background:
    linear-gradient(135deg,rgba(201,162,39,.12),transparent 40%),repeating-linear-gradient(45deg,#2a1e15 0 4px,#241a12 4px 8px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
  .trial .t-label{font-size:8px;color:#9f886f;letter-spacing:.08em}
  .trial .t-mark{font-family:Georgia,serif;font-size:14px;color:#d8c39f}
  .trial.revealed{background:linear-gradient(180deg,#e7d9bd,#cdbb9a);border-color:#e8d6b6}
  .trial.revealed .t-label{color:#4b3828}
  .trial.revealed .t-mark{color:#2a1e15}
  .trial.witch{background:linear-gradient(180deg,#5a1f1a,#2a0e0b);border-color:#a8322a}
  .trial.witch .t-label,.trial.witch .t-mark{color:#f0b6aa}
  .hand{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 10px 10px;scrollbar-width:none;min-height:98px}
  .hand::-webkit-scrollbar{display:none}
  .card{position:relative;flex:none;width:70px;height:92px;border-radius:7px;border:1px solid rgba(0,0,0,.45);padding:6px 5px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;transition:.16s transform,.16s box-shadow;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .card:after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.15);border-radius:4px;pointer-events:none}
  .card.red{background:linear-gradient(160deg,#b74436,#6f1f1a)}
  .card.green{background:linear-gradient(160deg,#5c7a50,#2f452b)}
  .card.blue{background:linear-gradient(160deg,#4a6b82,#243846)}
  .card.black{background:linear-gradient(160deg,#2a2420,#0e0b09)}
  .card.selected{transform:translateY(-9px);box-shadow:0 0 0 2px var(--gold2),0 10px 20px rgba(0,0,0,.5)}
  .card .c-name{font-family:"Noto Serif SC",Georgia,serif;font-size:12px;line-height:1.15;color:#fff7e8;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .card .c-pts{font-family:Georgia,serif;font-size:17px;line-height:1;color:#ffe8b0;margin:3px 0 1px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
  .card .c-desc{font-size:7px;line-height:1.2;color:rgba(255,247,232,.82);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-type{position:absolute;top:4px;right:5px;font-size:7px;letter-spacing:.1em;color:rgba(255,255,255,.55)}
  .card .c-open{font-size:8px;line-height:1;color:rgba(255,247,232,.55);margin-top:auto;padding-top:3px;letter-spacing:.06em}
  .empty-hand{width:100%;display:grid;place-items:center;color:var(--muted);font-size:11px;border:1px dashed #3a2b20;border-radius:8px;min-height:92px}
  .logline{display:flex;align-items:center;gap:6px;margin:6px 2px 0;font-size:9.5px;color:#b6a087;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logline b{color:var(--gold2);font-weight:500}
  .actionbar{position:relative;z-index:3;display:flex;gap:7px;padding:8px 12px 7px;border-top:1px solid rgba(201,162,39,.14);background:rgba(12,9,7,.9);backdrop-filter:blur(12px)}
  .btn{flex:1;height:40px;border-radius:10px;border:1px solid #4a3524;background:linear-gradient(180deg,#2a1e15,#17110d);color:#e7d6bb;font-size:11px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .btn.primary{border-color:#8f6f2a;background:linear-gradient(180deg,#4a3718,#2a1e0e);color:#f4dfae;box-shadow:0 0 16px rgba(201,162,39,.12),0 3px 0 rgba(0,0,0,.35)}
  .btn.danger{border-color:#6e2a24;background:linear-gradient(180deg,#3a1713,#1e0d0b);color:#e7b0a5}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.35;filter:grayscale(.6)}
  .variantbar{position:relative;z-index:3;display:flex;align-items:center;gap:5px;padding:6px 10px calc(7px + env(safe-area-inset-bottom));background:#100c09;border-top:1px solid rgba(255,255,255,.04)}
  .seg{flex:1;height:28px;border-radius:7px;font-size:9.5px;color:#9f886f;border:1px solid transparent}
  .seg.on{color:#f0dfbd;background:#2a1e15;border-color:#4a3524}
  .vsep{width:1px;height:18px;background:#2a1e15;margin:0 2px}
  .mini-select{height:28px;border-radius:7px;border:1px solid #3a2b20;background:#1a120d;color:#cbb89b;font-size:9.5px;padding:0 4px;outline:none}
  .role-toggle{height:28px;border-radius:7px;border:1px solid #3a2b20;background:#1a120d;color:#cbb89b;font-size:9.5px;padding:0 7px;white-space:nowrap}

  .setup{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:
    radial-gradient(600px 420px at 50% 0%,rgba(201,162,39,.12),transparent 60%),rgba(5,4,3,.92);backdrop-filter:blur(10px)}
  .setup.hidden{display:none}
  .setup-card{position:relative;width:min(340px,100%);border:1px solid rgba(201,162,39,.34);border-radius:18px;padding:20px 18px 16px;background:linear-gradient(180deg,#21170f,#120d09);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 4px rgba(201,162,39,.05)}
  .setup-card:before{content:"";position:absolute;inset:6px;border:1px solid rgba(231,199,102,.13);border-radius:13px;pointer-events:none}
  .setup-kicker{font-size:9px;letter-spacing:.3em;color:#9f886f;text-align:center}
  .setup h1{font-family:Georgia,"Noto Serif SC",serif;font-size:24px;letter-spacing:.08em;text-align:center;color:#f2e4c9;margin:6px 0 2px}
  .setup p{font-size:10px;line-height:1.6;color:#a48d75;text-align:center;margin:0 0 14px}
  .setup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(201,162,39,.12)}
  .setup-row label{font-size:11px;color:#e7d6bb;letter-spacing:.04em}
  .setup-row select{height:32px;border-radius:8px;border:1px solid #4a3524;background:#1a120d;color:#f0dfbd;font-size:11px;padding:0 8px;outline:none}
  .setup-summary{margin:12px 0 4px;padding:10px;border:1px dashed rgba(201,162,39,.28);border-radius:10px;font-size:10px;line-height:1.7;color:#cbb89b;text-align:center}
  .setup-summary b{color:#e7c766}
  .setup-error{color:#e7a99c;font-size:10px;text-align:center;min-height:14px;margin-top:6px}
  .setup-start{width:100%;height:44px;margin-top:10px;border-radius:11px;border:1px solid #8f6f2a;background:linear-gradient(180deg,#4a3718,#2a1e0e);color:#f4dfae;font-size:13px;letter-spacing:.08em;box-shadow:0 0 18px rgba(201,162,39,.12)}
  .setup-start:disabled{opacity:.4}

  .cardzoom{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  .cardzoom.open{display:flex}
  .cz-backdrop{position:absolute;inset:0;background:rgba(4,3,2,.78);backdrop-filter:blur(6px)}
  .cz-card{position:relative;width:min(340px,86vw);max-height:calc(100% - 16px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#f0e3c6,#dcc9a4);border:1px solid #8f6f2a;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 4px rgba(201,162,39,.12);color:#3a2416}
  .cz-art{position:relative;height:190px;flex:none;display:grid;place-items:center;border-bottom:1px solid rgba(90,60,30,.35);background:linear-gradient(160deg,#b74436,#6f1f1a)}
  .cz-card.green .cz-art{background:linear-gradient(160deg,#5c7a50,#2f452b)}
  .cz-card.blue .cz-art{background:linear-gradient(160deg,#4a6b82,#243846)}
  .cz-card.black .cz-art{background:linear-gradient(160deg,#2a2420,#0e0b09)}
  .cz-art:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,248,232,.28);border-radius:8px;pointer-events:none}
  .cz-glyph{font-size:64px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
  .cz-art .cz-type{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.12em;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff8e8}
  .cz-art .cz-points{position:absolute;right:16px;bottom:10px;font-family:Georgia,serif;font-size:38px;line-height:1;color:#ffe8b0;text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .cz-body{flex:1;min-height:0;padding:15px 18px 8px;overflow-y:auto}
  .cz-kicker{font-size:12px;letter-spacing:.14em;color:#7a5a3a}
  .cz-title{font-family:"Noto Serif SC",Georgia,serif;font-size:30px;line-height:1.15;margin:4px 0 8px;color:#3a2416}
  .cz-text{font-size:18px;line-height:1.65;margin:0;color:#4a3222}
  .cz-hint{font-size:12px;line-height:1.5;color:#7a5a3a;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(90,60,30,.3)}
  .cz-actions{display:flex;gap:8px;padding:12px 16px 16px;background:rgba(255,255,255,.25)}
  .cz-actions .btn{height:46px;background:linear-gradient(180deg,#2a1e15,#17110d);color:#f0dfbd;border-color:#4a3524}
  .cz-actions .btn.primary{background:linear-gradient(180deg,#8f6f2a,#5a4315);border-color:#c9a227;color:#fff7e8}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);background:#17110d;border-top:1px solid rgba(201,162,39,.3);border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6);padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:#4a3524;margin:0 auto 12px}
  .sheet h3{font-family:Georgia,"Noto Serif SC",serif;font-size:16px;margin:0 0 4px;color:#f2e4c9}
  .sheet p{font-size:11px;line-height:1.6;color:var(--muted);margin:0 0 12px}
  .sheet .row{display:flex;gap:8px}
  .night{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:
    radial-gradient(600px 400px at 50% 10%, #17202b 0%, #080b10 52%, #040507 100%);padding:24px 20px calc(20px + env(safe-area-inset-bottom));overflow:hidden}
  .night.open{display:flex}
  .night:before{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(#e7d6b6 0.7px,transparent 0.7px);background-size:46px 46px;mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 75%)}
  .night .stars{position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.8) 0 1px,transparent 2px),radial-gradient(circle at 74% 16%,rgba(255,255,255,.6) 0 1px,transparent 2px),radial-gradient(circle at 86% 42%,rgba(255,255,255,.5) 0 1px,transparent 2px),radial-gradient(circle at 32% 54%,rgba(255,255,255,.4) 0 1px,transparent 2px);opacity:.7}
  .night .moon{position:relative;width:92px;height:92px;border-radius:50%;margin:8px auto 4px;background:radial-gradient(circle at 38% 32%,#fff6d8,#e7c766 38%,#9c7422 66%,#3a2a0c);box-shadow:0 0 40px rgba(231,199,102,.3),0 0 90px rgba(231,199,102,.12)}
  .night .moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 66% 68%,rgba(58,42,12,.28) 0 8px,transparent 9px),radial-gradient(circle at 34% 58%,rgba(58,42,12,.18) 0 5px,transparent 6px)}
  .night .step{position:relative;z-index:2;text-align:center;margin-top:10px}
  .night .step .kicker{font-size:9px;letter-spacing:.28em;color:#8ea4b8;text-transform:uppercase}
  .night h2{font-family:Georgia,"Noto Serif SC",serif;font-size:22px;letter-spacing:.06em;margin:5px 0 6px;color:#f2e4c9}
  .night .sub{font-size:11px;line-height:1.6;color:#9fb0bf;max-width:290px;margin:0 auto}
  .night .panel{position:relative;z-index:2;flex:1;overflow-y:auto;margin-top:14px;padding:2px}
  .night-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .night-target{display:flex;align-items:center;gap:7px;padding:8px;border-radius:9px;border:1px solid #2a3a48;background:rgba(255,255,255,.035);text-align:left}
  .night-target .avatar{width:30px;height:30px;font-size:11px}
  .night-target b{font-size:10px;color:#dce7ef;display:block}
  .night-target span{font-size:8px;color:#8ea4b8}
  .night-target.on{border-color:#d45545;background:rgba(168,50,42,.18);box-shadow:0 0 0 1px rgba(212,85,69,.3)}
  .night .actions{position:relative;z-index:2;display:flex;gap:8px;margin-top:12px}
  .night .actions .btn{height:44px}
  .night .dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
  .night .dots i{width:5px;height:5px;border-radius:50%;background:#2a3a48}
  .night .dots i.on{background:#c9a227;box-shadow:0 0 6px rgba(201,162,39,.5)}
  .night-note{font-size:9px;color:#6f8394;text-align:center;margin-top:6px}
  .toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,10px);z-index:40;background:rgba(20,14,10,.94);border:1px solid rgba(201,162,39,.35);color:#f0dfbd;font-size:10.5px;padding:8px 12px;border-radius:9px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .tiny{font-size:8px;color:#6f5d4b;letter-spacing:.08em}
  @media (max-height:760px){.ring{height:330px}.table{min-height:330px}.table-center{width:142px;height:142px}.identity-ability{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <header class="topbar">
      <div class="room"><b>SALEM</b><span>4F2A · 朋友房</span></div>
      <div class="phase"><b id="phaseTitle">第 3 天 · 你的回合</b><span id="phaseSub">选择抽牌或出牌</span></div>
      <div class="timer"><b id="timer">72</b></div>
      <button class="iconbtn" id="menuBtn" aria-label="菜单">⋯</button>
    </header>

    <main class="main" id="main">
      <section class="public" id="public"></section>
      <section class="table variant-ring" id="table">
        <div class="ring" id="ring">
          <div class="table-center">
            <div class="moon-label">SALEM</div>
            <div class="center-meta">1692</div>
          </div>
        </div>
        <div class="strip" id="strip"></div>
        <div class="list" id="list"></div>
      </section>
      <div class="logline" id="logline">天亮了。牌堆还剩 34 张。</div>
      <section class="self" id="self"></section>
    </main>

    <footer class="actionbar" id="actionbar"></footer>

    <nav class="variantbar">
      <button class="seg on" data-variant="ring">环形</button>
      <button class="seg" data-variant="strip">卡带</button>
      <button class="seg" data-variant="list">列表</button>
      <span class="vsep"></span>
      <select class="mini-select" id="countSelect" aria-label="人数">
        <option value="4">4 人</option>
        <option value="5">5 人</option>
        <option value="6">6 人</option>
        <option value="7">7 人</option>
        <option value="8">8 人</option>
        <option value="9">9 人</option>
        <option value="10">10 人</option>
        <option value="11">11 人</option>
        <option value="12" selected>12 人</option>
      </select>
      <button class="role-toggle" id="roleToggle">视角：女巫</button>
    </nav>

    <div class="setup" id="setup" aria-hidden="false">
      <div class="setup-card">
        <div class="setup-kicker">SALEM 1692 · SETUP</div>
        <h1>开局配置</h1>
        <p>中文旧版规则 · 女巫数与每人身份卡数可调</p>
        <div class="setup-row"><label for="setupPlayers">玩家人数</label><select id="setupPlayers"></select></div>
        <div class="setup-row"><label for="setupWitches">女巫数量</label><select id="setupWitches"></select></div>
        <div class="setup-row"><label for="setupCards">每人身份卡</label><select id="setupCards"></select></div>
        <div class="setup-summary" id="setupSummary"></div>
        <div class="setup-error" id="setupError"></div>
        <button class="setup-start" id="setupStart">开始游戏</button>
      </div>
    </div>

    <div class="cardzoom" id="cardzoom" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="cz-backdrop" data-cz-close></div>
      <div class="cz-card" id="czCard">
        <div class="cz-art"><span class="cz-glyph" id="czGlyph">☝</span><span class="cz-type" id="czType">红卡</span><span class="cz-points" id="czPoints">+1</span></div>
        <div class="cz-body">
          <div class="cz-kicker" id="czKicker">红卡 · 1 点指控</div>
          <h2 class="cz-title" id="czTitle">指控</h2>
          <p class="cz-text" id="czText"></p>
          <div class="cz-hint" id="czHint">打出后，点一名玩家作为目标。</div>
        </div>
        <div class="cz-actions"><button class="btn" data-cz-close>取消</button><button class="btn primary" id="czPlay">打出</button></div>
      </div>
    </div>

    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle">玩家</h3>
      <p id="sheetBody"></p>
      <div class="row">
        <button class="btn" id="sheetClose">关闭</button>
      </div>
    </div>

    <div class="night" id="night">
      <div class="stars"></div>
      <div class="moon"></div>
      <div class="step">
        <div class="kicker" id="nightKicker">NIGHT 1</div>
        <h2 id="nightTitle">女巫请睁眼</h2>
        <div class="sub" id="nightSub">选择今夜的击杀目标。你可以选自己。</div>
      </div>
      <div class="panel" id="nightPanel"></div>
      <div class="dots" id="nightDots"></div>
      <div class="actions" id="nightActions"></div>
      <div class="night-note">原型演示 · 夜晚流程可跳过</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CARDS = {
    accusation:{name:"指控",color:"red",pts:1,desc:"+1 指控。达到门槛翻开一张身份卡。"},
    evidence:{name:"证据",color:"red",pts:3,desc:"+3 指控。科顿·马瑟面前只算 1 点。"},
    witness:{name:"目击",color:"red",pts:7,desc:"+7 指控。单独一张即可触发。"},
    alibi:{name:"辩护",color:"green",desc:"弃掉目标面前最多 3 张指控（或 1 张证据）。"},
    stocks:{name:"拘留",color:"green",desc:"目标跳过下一个回合。可叠加。"},
    scapegoat:{name:"嫁祸",color:"green",two:true,desc:"把来源面前所有牌移到去向面前。"},
    arson:{name:"纵火",color:"green",desc:"目标弃掉整手牌。莎拉·古德免疫。"},
    curse:{name:"诅咒",color:"green",desc:"弃掉目标面前一张蓝卡。"},
    robbery:{name:"抢劫",color:"green",two:true,desc:"把来源整手牌交给去向。"},
    asylum:{name:"避难",color:"blue",desc:"持有者夜晚不会被杀。"},
    blackcat:{name:"黑猫",color:"blue",desc:"传染被抽到时，持有者失去一张身份卡，由抽到传染者选。"},
    matchmaker:{name:"情侣",color:"blue",desc:"与另一名持有者绑定；一人死，另一人同死。"},
    piety:{name:"信徒",color:"blue",desc:"其他玩家不能对你打出红卡。"},
    conspiracy:{name:"传染",color:"black",desc:"立刻结算：翻黑猫持有者一张身份卡；全员从左邻取一张身份卡。"},
    night:{name:"夜晚",color:"black",desc:"立刻进入夜晚：女巫选杀、警长锤子、自首。"}
  };

  var TYPE_LABEL = {red:"红卡",green:"绿卡",blue:"蓝卡",black:"黑卡"};
  var GLYPHS = {accusation:"☝",evidence:"📜",witness:"👁",alibi:"🕯",stocks:"⛓",scapegoat:"🐐",arson:"🔥",curse:"🕸",robbery:"💰",asylum:"⛪",blackcat:"🐈‍⬛",matchmaker:"💞",piety:"🙏",conspiracy:"🕯",night:"🌙"};

  var PLAYERS = [
    {name:"你",id:"蒂图巴",initial:"蒂"},
    {name:"阿比",id:"阿比盖尔",initial:"阿"},
    {name:"安妮",id:"安妮·普特南",initial:"安"},
    {name:"科顿",id:"科顿·马瑟",initial:"科"},
    {name:"乔治",id:"乔治·伯勒斯",initial:"乔"},
    {name:"贾尔斯",id:"贾尔斯·科里",initial:"贾"},
    {name:"约翰",id:"约翰·普罗克特",initial:"约"},
    {name:"玛莎",id:"玛莎·科里",initial:"玛"},
    {name:"玛丽",id:"玛丽·沃伦",initial:"玛"},
    {name:"丽贝卡",id:"丽贝卡·诺斯",initial:"丽"},
    {name:"塞缪尔",id:"塞缪尔·帕里斯",initial:"塞"},
    {name:"莎拉",id:"莎拉·古德",initial:"莎"}
  ];

  var ABILITIES = {
    "蒂图巴":"每局一次，回合开始前重排牌堆（两倍沙漏）。",
    "阿比盖尔":"你打出最后一张指控时，可弃掉自己面前所有红卡。",
    "安妮·普特南":"回合结束，每翻开一张身份卡抽 2 张。",
    "科顿·马瑟":"打在你面前的证据只算 1 点指控。",
    "乔治·伯勒斯":"需要 8 点指控才失去身份卡。",
    "贾尔斯·科里":"回合抽两张都是红卡时，展示并补抽第三张。",
    "约翰·普罗克特":"玩家死亡时，从其手牌选至多 3 张，其余弃掉。",
    "玛莎·科里":"复制右邻第一个存活玩家的能力。",
    "玛丽·沃伦":"免疫情侣与黑猫的负面效果。",
    "丽贝卡·诺斯":"其他玩家因指控翻牌时，你抽 1 张。",
    "塞缪尔·帕里斯":"每局两次，花回合从弃牌堆拿至多 2 张非黑卡。",
    "莎拉·古德":"对你打出的抢劫和纵火无效，并立刻丢弃。",
    "托马斯·丹福斯":"第 6（或 7）点指控时可翻对方一张身份卡。",
    "威尔·格里格斯":"可把辩护当目击使用，+7。",
    "威廉·菲普斯":"每局一次，自首但不翻身份卡。"
  };

  var DEFAULTS = {
    4:{witchCount:1,cardsPerPlayer:5}, 5:{witchCount:1,cardsPerPlayer:5},
    6:{witchCount:2,cardsPerPlayer:5}, 7:{witchCount:2,cardsPerPlayer:5},
    8:{witchCount:2,cardsPerPlayer:5}, 9:{witchCount:1,cardsPerPlayer:5},
    10:{witchCount:2,cardsPerPlayer:3}, 11:{witchCount:2,cardsPerPlayer:3},
    12:{witchCount:2,cardsPerPlayer:3}
  };

  var ui = {variant:"ring",count:12,witchCount:2,cardsPerPlayer:3,selected:-1,source:null,selectedKey:null,night:null,zoomCard:-1};
  var state = null;

  function q(id){return document.getElementById(id);}
  function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
  function rand(n){return Math.floor(Math.random()*n);}

  function defaultsFor(count){
    return DEFAULTS[count] || DEFAULTS[12];
  }
  function range(a,b){ var out=[]; for(var i=a;i<=b;i++) out.push(i); return out; }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function buildTrials(count,witchCount,cardsPerPlayer){
    var kinds=[];
    for(var i=0;i<witchCount;i++) kinds.push("witch");
    kinds.push("constable");
    while(kinds.length<count*cardsPerPlayer) kinds.push("notawitch");
    shuffle(kinds);
    var out=[];
    for(var p=0;p<count;p++){
      out.push(kinds.slice(p*cardsPerPlayer,(p+1)*cardsPerPlayer).map(function(k){return {type:k,revealed:false};}));
    }
    return out;
  }
  function fillSelect(el, values, selected, suffix){
    el.innerHTML = values.map(function(v){
      return '<option value="'+v+'"'+(v===selected?' selected':'')+'>'+v+(suffix||'')+'</option>';
    }).join("");
  }
  function setupSelection(){
    var n=Number(q("setupPlayers").value);
    var w=Number(q("setupWitches").value);
    var c=Number(q("setupCards").value);
    return {count:n,witchCount:w,cardsPerPlayer:c};
  }
  function updateSetupSummary(){
    var s=setupSelection();
    var total=s.count*s.cardsPerPlayer;
    var town=total-s.witchCount-1;
    var ok=town>=0 && s.witchCount>=1 && s.witchCount<=s.count-1 && s.cardsPerPlayer>=2 && s.cardsPerPlayer<=8;
    q("setupSummary").innerHTML = '身份卡 <b>'+total+'</b> 张 = 女巫 <b>'+s.witchCount+'</b> + 警长 <b>1</b> + 平民 <b>'+Math.max(0,town)+'</b>'
      + '<br>默认：'+defaultsFor(s.count).witchCount+' 女巫 / 每人 '+defaultsFor(s.count).cardsPerPlayer+' 张';
    q("setupError").textContent = ok ? "" : "配置不合法：身份卡总数必须够女巫 + 警长";
    q("setupStart").disabled = !ok;
    return ok;
  }
  function refreshSetup(){
    var n=Number(q("setupPlayers").value);
    var d=defaultsFor(n);
    var w=Number(q("setupWitches").value);
    if(!Number.isInteger(w)||w<1||w>n-1) w=Math.min(d.witchCount,n-1);
    fillSelect(q("setupWitches"), range(1,n-1), w, " 女巫");
    var c=Number(q("setupCards").value);
    if(!Number.isInteger(c)||c<2||c>8) c=d.cardsPerPlayer;
    fillSelect(q("setupCards"), range(2,8), c, " 张/人");
    updateSetupSummary();
  }
  function openSetup(count){
    if(count) ui.count=count;
    q("setup").classList.remove("hidden");
    q("setup").setAttribute("aria-hidden","false");
    fillSelect(q("setupPlayers"), range(4,12), ui.count, " 人");
    fillSelect(q("setupWitches"), range(1,ui.count-1), ui.witchCount, " 女巫");
    fillSelect(q("setupCards"), range(2,8), ui.cardsPerPlayer, " 张/人");
    refreshSetup();
  }
  function closeSetup(){
    q("setup").classList.add("hidden");
    q("setup").setAttribute("aria-hidden","true");
  }
  function startSetup(){
    var s=setupSelection();
    if(!updateSetupSummary()) return;
    closeSetup();
    init(s.count,s.witchCount,s.cardsPerPlayer);
  }

  function init(count,witchCount,cardsPerPlayer){
    closeSetup();
    var d=defaultsFor(count);
    ui.count = count;
    ui.witchCount = witchCount || d.witchCount;
    ui.cardsPerPlayer = cardsPerPlayer || d.cardsPerPlayer;
    ui.selected = -1;
    ui.source = null;
    ui.selectedKey = null;
    ui.night = null;
    ui.zoomCard = -1;
    closeZoom();
    var trialSets = buildTrials(count,ui.witchCount,ui.cardsPerPlayer);
    var list = PLAYERS.slice(0,count).map(function(p,i){
      var trials = trialSets[i];
      return {
        id:i, name:p.name, identity:p.id, initial:p.initial,
        alive:true, connected:true, accusation:[0,3,0,5,6,2,0,4,1,0,2,0][i] || 0,
        trials:trials, blue:[], front:[], handCount:3, skip:false,
        isWitch:trials.some(function(t){return t.type==="witch";}),
        isConstable:trials.some(function(t){return t.type==="constable";})
      };
    });
    list[0].hand = ["accusation","arson","robbery","evidence","alibi","stocks","asylum"];
    state = {
      players:list, active:0, deck:34, discard:12, nightCount:1,
      phase:"你的回合", log:"天亮了。牌堆还剩 34 张。", over:false,
      config:{witchCount:ui.witchCount,cardsPerPlayer:ui.cardsPerPlayer}
    };
    q("countSelect").value = String(count);
    renderAll();
  }

  function threshold(p){
    if(p.identity==="乔治·伯勒斯") return 8;
    return 7;
  }

  function dotHtml(t){
    var cls = t.revealed ? (" revealed " + t.type) : "";
    return '<i class="dot'+cls+'"></i>';
  }

  function seatHtml(p, extraClass, style){
    var self = p.id===0;
    var cls = "seat"+(p.alive?"":" dead")+(state.active===p.id?" active":"")+(ui.selectedKey && ui.selectedKey!==p.id && p.alive?" targetable":"")+(ui.night && ui.night.target===p.id?" night-target":"");
    var dots = p.trials.map(dotHtml).join("");
    var blues = p.blue.slice(0,3).map(function(b){return '<i class="blue-dot'+(b==="piety"?" gold":"")+'"></i>';}).join("");
    return '<button class="'+cls+' '+extraClass+'" data-player="'+p.id+'"'+(style?' style="'+style+'"':'')+'>'
      + '<span class="avatar">'+p.initial+'</span>'
      + '<span class="seat-name">'+(self?"你 · "+p.name:p.name)+'</span>'
      + '<span class="seat-meta"><span class="acc-badge'+(p.accusation===0?" zero":"")+'">'+p.accusation+'</span><span class="trial-dots">'+dots+'</span><span style="display:flex;gap:2px">'+blues+'</span></span>'
      + '</button>';
  }

  function renderPublic(){
    var pi = state.players.filter(function(p){return p.alive;}).length;
    var chips = [
      '<span class="chip">牌堆 <b>'+state.deck+'</b></span>',
      '<span class="chip">弃牌 <b>'+state.discard+'</b></span>',
      '<span class="chip">夜晚 <b>'+state.nightCount+'</b></span>',
      '<span class="chip">女巫 <b>'+state.config.witchCount+'</b> · 每人 <b>'+state.config.cardsPerPlayer+'</b></span>',
      '<span class="chip hot">存活 <b>'+pi+'</b>/'+state.players.length+'</span>',
      '<span class="chip">当前 <b>'+state.players[state.active].name+'</b></span>'
    ];
    q("public").innerHTML = chips.join("");
    q("logline").innerHTML = state.log;
  }

  function renderTable(){
    var table = q("table");
    table.className = "table variant-"+ui.variant;
    var opponents = state.players.filter(function(p){return p.id!==0;});
    var ring = q("ring");
    var old = ring.querySelectorAll(".seat");
    for(var i=0;i<old.length;i++){ old[i].remove(); }
    if(ui.variant==="ring"){
      var n = opponents.length;
      var rx = 142, ry = 128;
      opponents.forEach(function(p,i){
        var a = (-90 + (360/n)*i) * Math.PI/180;
        var x = Math.cos(a)*rx;
        var y = Math.sin(a)*ry;
        ring.insertAdjacentHTML("beforeend", seatHtml(p,"", "left:calc(50% + "+x.toFixed(1)+"px);top:calc(50% + "+y.toFixed(1)+"px)"));
      });
    }
    q("strip").innerHTML = opponents.map(function(p){return seatHtml(p,"");}).join("");
    q("list").innerHTML = opponents.map(function(p){return seatHtml(p,"");}).join("");
  }

  function renderSelf(){
    var p = state.players[0];
    var role = (p.isWitch ? '<span class="role-badge">女巫</span>' : '<span class="role-badge good">平民</span>');
    var pips = "";
    for(var i=0;i<7;i++){ pips += '<i class="pip'+(i<p.accusation?" on":"")+'"></i>'; }
    var trials = p.trials.map(function(t){
      var cls = t.revealed ? (" revealed "+(t.type==="witch"?"witch":"")) : "";
      var label = t.revealed ? (t.type==="witch"?"女巫":(t.type==="constable"?"警长":"平民")) : "未揭示";
      var mark = t.revealed ? (t.type==="witch"?"✕":(t.type==="constable"?"⚖":"○")) : "?";
      return '<div class="trial'+cls+'"><span class="t-label">'+label+'</span><span class="t-mark">'+mark+'</span></div>';
    }).join("");
    var hand = (p.hand||[]).map(function(key,idx){
      var c = CARDS[key];
      var pts = c.pts ? '<div class="c-pts">'+c.pts+'</div>' : '';
      var sel = ui.selected===idx ? " selected" : "";
      return '<button class="card '+c.color+sel+'" data-card="'+idx+'">'
        + '<span class="c-type">'+(c.color==="red"?"红":c.color==="green"?"绿":c.color==="blue"?"蓝":"黑")+'</span>'
        + '<span class="c-name">'+c.name+'</span>'+pts
        + '<span class="c-open">点开</span></button>';
    }).join("");
    if(!hand){ hand = '<div class="empty-hand">手牌已空</div>'; }
    q("self").innerHTML = ''
      + '<div class="self-head">'
      +   '<div class="identity-seal">蒂</div>'
      +   '<div class="identity-info"><div class="identity-name">蒂图巴 '+role+'</div><div class="identity-ability">'+ABILITIES["蒂图巴"]+'</div></div>'
      +   '<div class="acc-meter"><div class="label">指控</div><div class="num">'+p.accusation+'</div><div class="pips">'+pips+'</div></div>'
      + '</div>'
      + '<div class="self-trials">'+trials+'</div>'
      + '<div class="hand" id="hand">'+hand+'</div>';
  }

  function renderActions(){
    var mine = state.active===0 && !state.over;
    var hint = ui.selected>=0 ? '<span class="tiny" style="flex:none;align-self:center">选目标</span>' : '';
    q("actionbar").innerHTML = hint
      + '<button class="btn" data-action="draw" '+(mine?"":"disabled")+'>抽 2 张</button>'
      + '<button class="btn primary" data-action="end" '+(mine?"":"disabled")+'>结束回合</button>'
      + '<button class="btn danger" data-action="night">夜晚演示</button>';
  }

  function renderZoom(){
    var p = state.players[0];
    var key = ui.zoomCard>=0 ? p.hand[ui.zoomCard] : null;
    if(!key){ closeZoom(); return; }
    var c = CARDS[key];
    var card = q("czCard");
    card.className = "cz-card " + c.color;
    q("czGlyph").textContent = GLYPHS[key] || "◆";
    q("czType").textContent = TYPE_LABEL[c.color] || "牌";
    q("czPoints").textContent = c.pts ? ("+"+c.pts) : "◆";
    q("czKicker").textContent = (TYPE_LABEL[c.color]||"牌") + (c.pts ? (" · "+c.pts+" 点指控") : "");
    q("czTitle").textContent = c.name;
    q("czText").textContent = c.desc;
    q("czHint").textContent = c.two ? "打出后先点来源，再点去向；两步都在牌桌上完成。" : "打出后，点一名玩家作为目标。";
  }

  function openZoom(idx){
    var p = state.players[0];
    if(!p.hand || !p.hand[idx]) return;
    ui.zoomCard = idx;
    renderZoom();
    q("cardzoom").classList.add("open");
    q("cardzoom").setAttribute("aria-hidden","false");
  }

  function closeZoom(){
    ui.zoomCard = -1;
    var el = q("cardzoom");
    if(el){ el.classList.remove("open"); el.setAttribute("aria-hidden","true"); }
  }

  function playZoom(){
    var p = state.players[0];
    var idx = ui.zoomCard;
    var key = idx>=0 ? p.hand[idx] : null;
    if(!key){ closeZoom(); return; }
    var c = CARDS[key];
    closeZoom();
    ui.selected = idx;
    ui.selectedKey = key;
    renderAll();
    toast("已选「"+c.name+"」，点一名玩家作为目标");
  }

  function renderAll(){
    renderPublic();
    renderTable();
    renderSelf();
    renderActions();
    q("roleToggle").textContent = "视角：" + (state.players[0].isWitch ? "女巫" : "平民");
    q("phaseTitle").textContent = state.over ? "本局结束" : ("第 "+(state.nightCount+2)+" 天 · "+(state.active===0?"你的回合":state.players[state.active].name+" 的回合"));
    q("phaseSub").textContent = state.over ? "查看结算" : (ui.selected>=0 ? "已选牌，点一名玩家作为目标" : (state.active===0?"选择抽牌或出牌":"等待他人行动"));
    q("timer").textContent = state.over ? "—" : "72";
    document.querySelectorAll(".seg").forEach(function(b){ b.classList.toggle("on", b.dataset.variant===ui.variant); });
  }

  function toast(msg){
    var t = q("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("on"); }, 2100);
  }

  function log(msg){ state.log = msg; q("logline").innerHTML = msg; }

  function revealTrial(p){
    var t = p.trials.find(function(x){return !x.revealed;});
    if(!t) return false;
    t.revealed = true;
    log("<b>"+p.name+"</b> 翻开一张身份卡："+(t.type==="witch"?"女巫":(t.type==="constable"?"警长":"平民"))+"。");
    if(t.type==="witch"){ kill(p,"翻到女巫牌"); }
    else if(p.trials.every(function(x){return x.revealed;})){ kill(p,"身份卡全部揭示"); }
    return true;
  }

  function addAccusation(p,pts){
    p.accusation += pts;
    var guard=0;
    while(p.alive && p.accusation>=threshold(p) && p.trials.some(function(t){return !t.revealed;}) && guard<4){
      guard++;
      p.accusation = 0;
      revealTrial(p);
      if(!p.alive) break;
    }
  }

  function kill(p,cause,chain){
    if(!p || !p.alive) return;
    p.alive=false;
    p.trials.forEach(function(t){t.revealed=true;});
    log("<b>"+p.name+"</b> 死亡（"+cause+"）。");
    if(p.blue.indexOf("matchmaker")>=0 && !chain){
      var partner = state.players.find(function(x){return x.alive && x.id!==p.id && x.blue.indexOf("matchmaker")>=0;});
      if(partner){ setTimeout(function(){ kill(partner,"情侣连锁",true); renderAll(); }, 420); }
    }
    checkWin();
  }

  function checkWin(){
    if(state.over) return;
    var allWitchRevealed = state.players.every(function(p){
      return p.trials.filter(function(t){return t.type==="witch";}).every(function(t){return t.revealed;});
    });
    var alive = state.players.filter(function(p){return p.alive;});
    if(allWitchRevealed){ state.over=true; log("<b>平民胜利</b>：所有女巫身份卡都已揭示。"); toast("平民胜利"); }
    else if(alive.length>0 && alive.every(function(p){return p.isWitch;})){ state.over=true; log("<b>女巫胜利</b>：存活玩家都曾是女巫。"); toast("女巫胜利"); }
  }

  function applyCard(targetId){
    var p = state.players[0];
    var key = p.hand[ui.selected];
    if(!key) return;
    var c = CARDS[key];
    var target = state.players[targetId];
    if(!target || !target.alive){ toast("目标已死亡"); return; }
    if(targetId===0 && c.color==="red"){ toast("指控不能打自己"); return; }
    if(c.color==="red" && target.blue.indexOf("piety")>=0){ toast("信徒：不能对 "+target.name+" 打出红卡"); return; }

    if(c.two){
      if(ui.source===null){
        ui.source = targetId;
        toast("已选来源，再选去向");
        renderAll();
        return;
      }
      if(ui.source===targetId){ toast("来源和去向不能是同一人"); return; }
      var source = state.players[ui.source];
      if(key==="scapegoat"){
        var moved = source.front.length;
        var movedPts = 0;
        source.front.forEach(function(k){ target.front.push(k); if(CARDS[k] && CARDS[k].pts) movedPts += CARDS[k].pts; });
        source.front = [];
        source.accusation = 0;
        addAccusation(target, movedPts);
        log("<b>嫁祸</b>：把 "+source.name+" 面前的 "+moved+" 张牌移到 "+target.name+" 面前（+"+movedPts+" 点）。");
      } else if(source.identity==="莎拉·古德"){
        log("<b>抢劫</b>："+source.name+" 免疫，卡牌丢弃。");
      } else {
        target.handCount += source.handCount;
        source.handCount = 0;
        log("<b>抢劫</b>：把 "+source.name+" 的整手牌交给 "+target.name+"。");
      }
      ui.source = null;
    } else if(key==="accusation" || key==="evidence" || key==="witness"){
      var pts = c.pts;
      if(target.identity==="科顿·马瑟" && key==="evidence") pts = 1;
      target.front.push(key);
      addAccusation(target,pts);
      log("<b>"+c.name+"</b> → "+target.name+"，+"+pts+" 点指控。");
    } else if(key==="alibi"){
      target.accusation = clamp(target.accusation-3,0,99);
      log("<b>辩护</b>："+target.name+" 的红卡减少。");
    } else if(key==="stocks"){
      target.skip = true; target.front.push(key);
      log("<b>拘留</b>："+target.name+" 将跳过下一个回合。");
    } else if(key==="arson"){
      if(target.identity==="莎拉·古德"){
        log("<b>纵火</b>："+target.name+" 免疫，卡牌丢弃。");
      } else {
        var oldHand = target.handCount;
        target.handCount = 0;
        log("<b>纵火</b>："+target.name+" 弃掉 "+oldHand+" 张手牌。");
      }
    } else if(key==="curse"){
      if(target.blue.length){ var removed = target.blue.pop(); log("<b>诅咒</b>：弃掉 "+target.name+" 的 "+removed+"。"); }
      else { toast("目标没有蓝卡"); return; }
    } else if(key==="asylum" || key==="piety" || key==="matchmaker" || key==="blackcat"){
      target.blue.push(key);
      log("<b>"+c.name+"</b> 放到 "+target.name+" 面前。");
    }

    p.hand.splice(ui.selected,1);
    state.discard++;
    ui.selected = -1;
    ui.selectedKey = null;
    ui.source = null;
    renderAll();
  }

  function onTarget(id){
    if(ui.night && ui.night.open){ ui.night.target=id; renderNight(); return; }
    if(ui.selected>=0){ applyCard(id); return; }
    var p = state.players[id];
    q("sheetTitle").textContent = p.name + " · " + p.identity;
    q("sheetBody").innerHTML = (p.alive?"存活":"已死亡") + " · 指控 " + p.accusation + "/" + threshold(p) + " · 手牌 " + p.handCount + " 张<br>身份能力：" + (ABILITIES[p.identity]||"—");
    q("sheet").classList.add("open");
  }

  function drawTwo(){
    var p = state.players[0];
    var keys = ["accusation","accusation","accusation","evidence","alibi","stocks","asylum","piety"];
    for(var i=0;i<2;i++){
      if(state.deck<=0){ toast("牌堆已空"); return; }
      state.deck--;
      var k = keys[rand(keys.length)];
      p.hand.push(k);
    }
    state.discard += 0;
    log("你抽了 2 张牌。");
    renderAll();
  }

  function endTurn(){
    var next = state.active;
    for(var i=1;i<=state.players.length;i++){
      var cand = (state.active+i)%state.players.length;
      if(state.players[cand].alive){ next=cand; break; }
    }
    state.active = next;
    if(state.players[next].skip){ state.players[next].skip=false; log("<b>"+state.players[next].name+"</b> 被拘留跳过。"); }
    log("轮到 <b>"+state.players[next].name+"</b>。");
    renderAll();
  }

  function openNight(){
    ui.night = {open:true,step:0,target:null,confessed:false,hammer:null,result:null};
    renderNight();
  }

  function closeNight(){
    ui.night = {open:false,step:0,target:null};
    q("night").classList.remove("open");
    renderAll();
  }

  function nightAlive(){
    return state.players.filter(function(p){return p.alive;});
  }

  function renderNight(){
    if(!ui.night || !ui.night.open){ q("night").classList.remove("open"); return; }
    q("night").classList.add("open");
    var n = ui.night;
    var steps = ["女巫请睁眼","警长请放锤子","自首窗口","天亮"];
    q("nightKicker").textContent = "NIGHT " + state.nightCount + " · " + (n.step+1) + "/4";
    q("nightTitle").textContent = steps[n.step];
    q("nightDots").innerHTML = steps.map(function(_,i){return '<i class="'+(i<=n.step?"on":"")+'"></i>';}).join("");
    var panel = q("nightPanel");
    var actions = q("nightActions");

    if(n.step===0){
      if(state.players[0].isWitch){
        q("nightSub").textContent = "你是女巫。选择今夜的击杀目标；可以选自己。";
        panel.innerHTML = '<div class="night-grid">' + nightAlive().map(function(p){
          return '<button class="night-target'+(n.target===p.id?" on":"")+'" data-night-target="'+p.id+'"><span class="avatar">'+p.initial+'</span><span><b>'+p.name+'</b><span>指控 '+p.accusation+' · 手牌 '+p.handCount+'</span></span></button>';
        }).join("") + '</div>';
        actions.innerHTML = '<button class="btn" data-night="next">跳过</button><button class="btn danger" data-night="kill" '+(n.target===null?"disabled":"")+'>确认击杀</button>';
      } else {
        q("nightSub").textContent = "你睡着了。只听到风穿过木屋的声音。";
        panel.innerHTML = '<div style="text-align:center;padding:28px 0;color:#6f8394;font-size:11px">非女巫视角不会收到任何女巫名单或击杀信息。</div>';
        actions.innerHTML = '<button class="btn" data-night="next">继续</button>';
      }
    } else if(n.step===1){
      q("nightSub").textContent = state.players[0].isConstable ? "你是警长。选择一名其他玩家放锤子。" : "警长正在选择是否放锤子。";
      panel.innerHTML = state.players[0].isConstable
        ? '<div class="night-grid">'+nightAlive().filter(function(p){return p.id!==0;}).map(function(p){return '<button class="night-target'+(n.hammer===p.id?" on":"")+'" data-hammer="'+p.id+'"><span class="avatar">'+p.initial+'</span><span><b>'+p.name+'</b><span>放锤子</span></span></button>';}).join("")+'</div>'
        : '<div style="text-align:center;padding:28px 0;color:#6f8394;font-size:11px">你没有警长身份卡。</div>';
      actions.innerHTML = '<button class="btn" data-night="next">继续</button>';
    } else if(n.step===2){
      q("nightSub").textContent = "你可以翻自己一张身份卡，换取今夜免死。翻到女巫牌仍会死亡。";
      panel.innerHTML = '<div style="padding:10px;border:1px solid #2a3a48;border-radius:9px;color:#9fb0bf;font-size:10px;line-height:1.7">自首是公开的。每夜都可以自首；本原型只演示一次。</div>';
      actions.innerHTML = '<button class="btn" data-night="no-confess">不自首</button><button class="btn danger" data-night="confess">自首</button>';
    } else {
      q("nightSub").textContent = n.result || "天亮了。";
      panel.innerHTML = '<div style="text-align:center;padding:20px 0"><div style="font-family:Georgia,serif;font-size:34px;color:#e7c766">☀</div><div style="font-size:11px;color:#9fb0bf;margin-top:8px">'+(n.result||"")+'</div></div>';
      actions.innerHTML = '<button class="btn primary" data-night="close">回到牌桌</button>';
    }
  }

  function resolveNight(){
    var n = ui.night;
    var target = n.target!==null ? state.players[n.target] : null;
    if(!target){ n.result="昨夜无人死亡。"; n.step=3; renderNight(); return; }
    var saved = n.confessed || n.hammer===target.id || target.blue.indexOf("asylum")>=0;
    if(saved){ n.result = target.name+" 被救下，昨夜无人死亡。"; }
    else { kill(target,"夜晚击杀"); n.result = target.name+" 在昨夜死亡。"; }
    n.step=3;
    renderNight();
    renderAll();
  }

  function handleNight(action){
    var n = ui.night;
    if(action==="next"){ n.step++; renderNight(); return; }
    if(action==="kill"){ n.step=1; renderNight(); return; }
    if(action==="no-confess"){ n.confessed=false; n.step=3; resolveNight(); return; }
    if(action==="confess"){ n.confessed=true; var p=state.players[0]; var t=p.trials.find(function(x){return !x.revealed;}); if(t){ t.revealed=true; log("<b>你自首</b>，翻开一张身份卡："+(t.type==="witch"?"女巫":(t.type==="constable"?"警长":"平民"))+"。"); if(t.type==="witch"){ kill(p,"自首翻到女巫牌"); } } n.step=3; resolveNight(); return; }
    if(action==="close"){ closeNight(); return; }
  }

  document.addEventListener("click", function(e){
    var seat = e.target.closest("[data-player]");
    if(seat){ onTarget(Number(seat.dataset.player)); return; }
    var czClose = e.target.closest("[data-cz-close]");
    if(czClose){ closeZoom(); return; }
    var card = e.target.closest("[data-card]");
    if(card){ openZoom(Number(card.dataset.card)); return; }
    var act = e.target.closest("[data-action]");
    if(act){
      var a = act.dataset.action;
      if(a==="draw") drawTwo();
      if(a==="end") endTurn();
      if(a==="night") openNight();
      return;
    }
    var nt = e.target.closest("[data-night-target]");
    if(nt){ ui.night.target=Number(nt.dataset.nightTarget); renderNight(); return; }
    var hm = e.target.closest("[data-hammer]");
    if(hm){ ui.night.hammer=Number(hm.dataset.hammer); renderNight(); return; }
    var nb = e.target.closest("[data-night]");
    if(nb){ handleNight(nb.dataset.night); return; }
    var seg = e.target.closest("[data-variant]");
    if(seg){ setVariant(seg.dataset.variant); return; }
  });

  q("sheetClose").addEventListener("click", function(){ q("sheet").classList.remove("open"); });
  q("czPlay").addEventListener("click", playZoom);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeZoom(); q("sheet").classList.remove("open"); } });
  q("countSelect").addEventListener("change", function(e){ openSetup(Number(e.target.value)); });
  q("setupPlayers").addEventListener("change", refreshSetup);
  q("setupWitches").addEventListener("change", updateSetupSummary);
  q("setupCards").addEventListener("change", updateSetupSummary);
  q("setupStart").addEventListener("click", startSetup);
  q("roleToggle").addEventListener("click", function(){
    var p=state.players[0]; p.isWitch=!p.isWitch;
    this.textContent = "视角：" + (p.isWitch?"女巫":"平民");
    renderAll();
  });
  q("menuBtn").addEventListener("click", function(){ openSetup(ui.count); });

  function setVariant(v){
    ui.variant = v;
    var url = new URL(location.href);
    url.searchParams.set("variant",v);
    url.searchParams.set("count",ui.count);
    history.replaceState(null,"",url);
    renderAll();
  }

  function fitPhone(){ q("phone").style.height = Math.min(900, window.innerHeight) + "px"; }
  fitPhone();
  window.addEventListener("resize", fitPhone);

  var params = new URLSearchParams(location.search);
  var v = params.get("variant") || "ring";
  var c = Number(params.get("count") || 12);
  if(["ring","strip","list"].indexOf(v)<0) v="ring";
  if(c<4 || c>12 || !Number.isInteger(c)) c=12;
  ui.variant = v;
  ui.count = c;
  ui.witchCount = defaultsFor(c).witchCount;
  ui.cardsPerPlayer = defaultsFor(c).cardsPerPlayer;
  q("countSelect").value = String(c);
  if(params.get("autostart")==="1") init(c, ui.witchCount, ui.cardsPerPlayer);
  else openSetup(c);
})();
</script>
</body>
</html>
